{% extends 'base.html' %}
{% block title %}Registrarse | InduPedidos{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 520px">
<h2>Crear usuario</h2>
<form method="post">{% csrf_token %}
{{ form.as_p }}
<button class="btn btn-dark" type="submit">Registrarse</button>
</form>
<p class="mt-3 mb-0">¿Ya tenés usuario? <a href="{% url 'login' %}">Iniciá sesión</a></p>
</div>
{% endblock %}
